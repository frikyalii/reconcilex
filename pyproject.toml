[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconcilex"
version = "0.1.0"
description = "Production-oriented, agent-assisted e-commerce data reconciliation platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ReconcileX Engineering" }
]
dependencies = [
    "fastapi>=0.92.0,<1.0.0",
    "uvicorn>=0.17.6,<1.0.0",
    "pydantic>=1.10.4,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "python-multipart>=0.0.5,<1.0.0",
    "httpx>=0.23.3,<1.0.0",
]

[project.optional-dependencies]
production = [
    "sqlalchemy>=2.0.25,<3.0.0",
    "alembic>=1.13.1,<2.0.0",
    "psycopg[binary]>=3.1.18,<4.0.0",
    "celery>=5.3.6,<6.0.0",
    "redis>=5.0.1,<6.0.0",
    "qdrant-client>=1.8.0,<2.0.0",
    "langgraph>=0.0.40,<1.0.0",
    "langchain-core>=0.1.40,<1.0.0",
    "langchain-huggingface>=0.0.3,<1.0.0",
    "sentence-transformers>=2.6.0,<4.0.0",
    "opentelemetry-api>=1.23.0,<2.0.0",
    "opentelemetry-sdk>=1.23.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0,<1.0.0",
    "prometheus-client>=0.20.0,<1.0.0",
]
dev = [
    "pytest>=7.0.0,<10.0.0",
    "ruff>=0.3.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
